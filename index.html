<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIZEROLL | The professional rolling stool</title>
  <meta name="description" content="A professional rolling stool, with an advisor that checks whether it fits your workstation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/product.css">
</head>
<body>
  <header class="top-bar">
    <span class="logo">WIZEROLL</span>
  </header>

  <main class="product">
    <div class="product-media">
      <div class="product-image">
        <img id="product-image" src="images/product.jpg" alt="The WIZEROLL rolling stool">
        <span class="product-image-placeholder">PRODUCT IMAGE COMING SOON</span>
      </div>
      <div id="spin-view" class="spin-view" hidden aria-label="360 degree view of the stool. Drag to turn it."></div>
      <button id="spin-toggle" class="media-badge spin-toggle" type="button" aria-pressed="false" hidden>
        <span aria-hidden="true">360°</span>
        <span class="visually-hidden">Show the 360 degree view</span>
      </button>
      <button id="video-open" class="media-pill" type="button" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
        Watch the video
      </button>
    </div>

    <dialog id="video-dialog" class="video-dialog" aria-label="WIZEROLL brand video">
      <div class="video-frame" id="video-frame"></div>
      <form method="dialog">
        <button class="button button-secondary" type="submit">Close</button>
      </form>
    </dialog>

    <h1>The professional rolling stool</h1>
    <p class="tagline">Your seating partner for long work days.</p>

    <section class="specs" aria-labelledby="specs-title">
      <h2 id="specs-title">Specification</h2>
      <p id="spec-status" role="status">Loading the specification…</p>
      <ul id="spec-list"></ul>
    </section>

    <div class="entry-buttons">
      <a class="button button-primary" href="advisor.html?path=fit">Does it fit me? (Fit advisor)</a>
      <a class="button button-secondary" href="advisor.html?path=service">I have a fault (Support and service)</a>
    </div>
  </main>

  <form id="free-text-form" class="composer">
    <div class="composer-inner">
      <label class="visually-hidden" for="free-text">Or just tell us what's on your mind</label>
      <input id="free-text" type="text" maxlength="1000" autocomplete="off" placeholder="Or just tell us what's on your mind…">
      <button type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
      </button>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cloudimage-360-view@4.9.5/dist/js-cloudimage-360-view.min.js"></script>
  <script type="module" src="js/product.js"></script>
</body>
</html>
